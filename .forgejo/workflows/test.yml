name: Test

# 変更の申請（PR）と main への push で `flutter analyze` と `flutter test` を流す
# （task #410・#452）。
# 読むだけの検査で、版上げ・配布はしない（それは version_bump.yml と deck）。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 30
    # ⚠ リリースと同じビルダーを digest で継いだ台（wbstimer・foodexpiryapp と同じ）。
    #   タグではなく digest で固定する。上げるときは他のアプリと揃える。
    # ⚠ キャッシュは `actions/cache` ではなく名前付きボリューム（台の
    #   `valid_volumes` が `flutter-pub-cache` を許している）。
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:5c2c5942a6e77dca2d3a0fc7d2b08d96d0a9aa89bfc1c01ada48eea1fcc82aee
      options: >-
        -v flutter-pub-cache:/cache/pub
    env:
      PUB_CACHE: /cache/pub
    steps:
      - uses: actions/checkout@v5

      - name: Flutter toolchain
        run: flutter --version

      # pubspec.lock をコミットしてあるので、それと違う解決なら落とす（task #452）。
      - name: pub get
        run: flutter pub get --enforce-lockfile

      # pub get の生成物（.dart_tool/ など）は .gitignore が受ける（task #468）。
      - name: Nothing untracked after pub get
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

      # wbstimer・foodexpiryapp と同じく info も落とす（task #452）。
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      # 画面試験が撮った画像（test/helpers/screenshot.dart、task #451）。
      # ⚠ v4 以降は act_runner で黙って何も上げない。このタグで固定する。
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: screenshots
          path: build/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # Android のビルドが通り、Flutter の「Kotlin Gradle Plugin を当てていると
  # 将来ビルドできなくなる」警告が出ないこと（task #453）。警告はアプリ自身の
  # build.gradle と、KGP を当てる部品の両方で出る。配る段（deck）と同じ台で
  # debug の APK を作り、記録に警告があれば落とす。
  android-build:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 40
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:5c2c5942a6e77dca2d3a0fc7d2b08d96d0a9aa89bfc1c01ada48eea1fcc82aee
      options: >-
        -v flutter-pub-cache:/cache/pub
        -v flutter-gradle-cache-qrgen-ci:/cache/gradle
    env:
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
    steps:
      - uses: actions/checkout@v5

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: Build a debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: No Kotlin Gradle Plugin warning
        run: |
          if grep -n "Kotlin Gradle Plugin" build.log; then
            echo "::error::Flutter warns about the Kotlin Gradle Plugin (task #453)"
            exit 1
          fi

      # ビルドの生成物（local.properties・gradlew・GeneratedPluginRegistrant
      # など）も .gitignore が受ける（task #468）。build.log はこのジョブが書いたもの。
      - name: Nothing untracked after the build
        run: |
          git status --porcelain --untracked-files=all -- . ':!build.log'
          test -z "$(git status --porcelain --untracked-files=all -- . ':!build.log')"
