name: Test

# Run `flutter analyze` and `flutter test` on pull requests and pushes to main
# (task #410, #452).
# A read-only check; it does not bump the version or deploy (that is version_bump.yml and deck).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 30
    # ⚠ A runner image that inherits the release builder by digest (same as wbstimer and foodexpiryapp).
    #   Pin it by digest, not by tag. Keep it in step with the other apps when bumping.
    # ⚠ The cache is a named volume, not `actions/cache` (the runner's
    #   `valid_volumes` allows `flutter-pub-cache`).
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:c613b975c5242a60abd7c159688159788ac2b9c6f8339f10f4ce928dbac483b9
      options: >-
        -v flutter-pub-cache:/cache/pub
    env:
      PUB_CACHE: /cache/pub
    steps:
      - uses: actions/checkout@v5

      - name: Flutter toolchain
        run: flutter --version

      # pubspec.lock is committed, so fail if the resolution differs from it (task #452).
      - name: pub get
        run: flutter pub get --enforce-lockfile

      # Files generated by pub get (.dart_tool/ etc.) are covered by .gitignore (task #468).
      - name: Nothing untracked after pub get
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"

      # Fail on infos too, same as wbstimer and foodexpiryapp (task #452).
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

      # Screenshots taken by the screen tests (test/helpers/screenshot.dart, task #451).
      # ⚠ v4 and later silently upload nothing on act_runner. Pinned to this tag.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v3.2.2-node20
        with:
          name: screenshots
          path: build/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # The Android build must pass without Flutter's "applying the Kotlin Gradle Plugin
  # will break the build in the future" warning (task #453). The warning comes from both
  # the app's own build.gradle and plugins that apply KGP. Build a debug APK on the same
  # runner as the deploy stage (deck) and fail if the log contains the warning.
  android-build:
    runs-on: [self-hosted, nolumialab]
    timeout-minutes: 40
    container:
      image: hub.nolumia.com:5000/builder/ci-flutter@sha256:c613b975c5242a60abd7c159688159788ac2b9c6f8339f10f4ce928dbac483b9
      options: >-
        -v flutter-pub-cache:/cache/pub
        -v flutter-gradle-cache-qrgen-ci:/cache/gradle
    env:
      PUB_CACHE: /cache/pub
      GRADLE_USER_HOME: /cache/gradle
    steps:
      - uses: actions/checkout@v5

      - name: pub get
        run: flutter pub get --enforce-lockfile

      - name: Build a debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: No Kotlin Gradle Plugin warning
        run: |
          if grep -n "Kotlin Gradle Plugin" build.log; then
            echo "::error::Flutter warns about the Kotlin Gradle Plugin (task #453)"
            exit 1
          fi

      # Build outputs (local.properties, gradlew, GeneratedPluginRegistrant
      # etc.) are also covered by .gitignore (task #468). build.log is written by this job.
      - name: Nothing untracked after the build
        run: |
          git status --porcelain --untracked-files=all -- . ':!build.log'
          test -z "$(git status --porcelain --untracked-files=all -- . ':!build.log')"
