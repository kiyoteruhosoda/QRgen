          U3diXZ2qnZH/7eHbCUm3u4dLZmrXYNOj/HH9vrq6oBi1220CIklmWL3SUjd+QVc=
          -----END CERTIFICATE-----
          CERT

          work=$(mktemp -d)
          printf '%s' "$KEYSTORE_BASE64" | base64 -di > "$work/upload-keystore.jks"
          printf '%s\n' "$KEY_ALIAS" > "$work/alias"
          printf '%s\n' "$STORE_PASSWORD" > "$work/store-pass"
          printf '%s\n' "$KEY_PASSWORD" > "$work/key-pass"

          mkdir -p out
          tar -C "$work" -cf - . \
            | openssl cms -encrypt -binary -aes256 -outform DER \
                -recip intake-cert.pem -out out/qrgen-signing-key.p7m
          rm -rf "$work"
          echo "sealed: $(wc -c < out/qrgen-signing-key.p7m) bytes"

      - uses: actions/upload-artifact@v5
        with:
          name: qrgen-signing-key-sealed
          path: out/qrgen-signing-key.p7m
          retention-days: 1
