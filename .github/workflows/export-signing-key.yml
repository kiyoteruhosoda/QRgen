name: Export signing key (one-off)

# 署名鍵を GitHub Secrets から nolumialab へ移すための、一度きりの workflow。
#
# リリースビルドは nolumialab の deck（deploy-repo の docs/flutter-signing.md）へ
# 移した。鍵の正本は GitHub Secrets にしか無く、Secrets は読み出せないので、
# ここで鍵と合言葉を **nolumialab の使い捨ての公開鍵で封をして** artifact に置く。
# 封を開ける秘密鍵は nolumialab の /srv/secrets/qrgen-key-intake/ にしか無い
# （下の証明書は 2026-10-04 に失効する）。
#
# ⚠ 平文はこのジョブの一時ディレクトリの中だけを通る。ログに値を出さない。
# ⚠ 移し終えたら、この workflow と Secrets を消すこと。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main' && github.repository == 'kiyoteruhosoda/QRgen'
    runs-on: ubuntu-latest
    steps:
      - name: Seal the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty"; exit 1; fi
          done

          cat > intake-cert.pem <<'CERT'
