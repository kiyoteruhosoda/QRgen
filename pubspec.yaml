name: flutterbase
description: QR code scanner and generator app
publish_to: "none"

version: 1.7.4+154

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  # Equatable (value objects)
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Save generated codes into the photo gallery (task #411)
  gal: ^2.3.0

  # DI
  get_it: ^7.7.0

  # Image picker (scan from gallery)
  image_picker: ^1.1.2

  # Logging
  logger: ^2.4.0

  # QR code scanning
  mobile_scanner: ^7.0.0

  # Package info
  package_info_plus: ^10.2.2

  # Log files directory
  path_provider: ^2.1.0

  # QR code generation
  qr_flutter: ^4.1.0

  # Share sheet for exported logs (task #411)
  share_plus: ^13.3.1

  # Shared preferences
  shared_preferences: ^2.3.0

  # URL launcher (for licenses and QR results)
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
